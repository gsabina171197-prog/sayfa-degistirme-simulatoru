name: testler

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Birim testleri
        run: python -m unittest discover -s tests -v
      - name: Örnek senaryo (duman testi)
        run: python main.py --file data/ornek.txt --frames 3 --summary --no-color
